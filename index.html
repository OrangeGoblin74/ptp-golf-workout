<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    deleteDoc,
    doc,
    setDoc,
    getDocs,
    writeBatch,
    onSnapshot, 
    query, 
    orderBy,
    enableIndexedDbPersistence 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const keyPart1 = "AIzaSyADhDIPOww0ISV";
const keyPart2 = "bPGfM9YeC56fEfRr1Y-k";

const firebaseConfig = {
  apiKey: keyPart1 + keyPart2,
  authDomain: "ptp-golf-tracker.firebaseapp.com",
  projectId: "ptp-golf-tracker",
  storageBucket: "ptp-golf-tracker.firebasestorage.app",
  messagingSenderId: "1027233613421",
  appId: "1:1027233613421:web:3844687d007958fca82164"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  enableIndexedDbPersistence(db).catch(() => {});

  window.db = db;
  window.dbCollection = collection(db, "workout_history");
  window.setDoc = setDoc;
  window.getDocs = getDocs;
  window.writeBatch = writeBatch;
  window.deleteDoc = deleteDoc;
  window.doc = doc;
  window.onSnapshot = onSnapshot;
  window.query = query;
  window.orderBy = orderBy;

  // Immediate Auth Trigger & Alert
  console.log("Attempting Anonymous Auth...");
signInAnonymously(auth)
  .then((cred) => {
    console.log("Authenticated UID:", cred.user.uid);
  })
  .catch((err) => {
    console.error("Auth Error:", err);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("Device session active:", user.uid);
      initFirestoreListener();
    }
  });

  function initFirestoreListener() { setStatus("busy");
    const q = query(window.dbCollection, orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      const cloudHistory = [];
      snapshot.forEach((d) => {
        cloudHistory.push({ ...d.data(), id: d.id });
      });
      localStorage.setItem('ptp_workout_history', JSON.stringify(cloudHistory));
      if (window.currentParentTab === 'History' && window.renderHistory) window.renderHistory();
      if (window.currentParentTab === 'Analytics' && window.renderAnalytics) window.renderAnalytics(); markSynced(cloudHistory.length);
    }, (error) => {
      setStatus("bad"); console.warn("Firestore access blocked or restricted:", error);
    });
  }
</script>

function setStatus(x){const e=document.getElementById('sync');if(!e)return;e.className='pill '+x;e.textContent=x==='ok'?'● Synced':x==='bad'?'● Offline':'● Syncing';}
function markSynced(n){cloudCount=n;const t=new Date();localStorage.setItem('ptp_last_sync',t.toISOString());document.getElementById('sync-time').textContent='Last sync: '+t.toLocaleString();setStatus('ok');backupReminder();}
addEventListener('offline',()=>setStatus('bad'));addEventListener('online',()=>setStatus('busy'));
function sessions(h=getHistory()){const o={};h.forEach(x=>(o[`${x.date} - ${x.day}`]||=[]).push(x));return o;}
function key(x){return JSON.stringify(Object.keys(x).filter(k=>!['id','timestamp'].includes(k)).sort().map(k=>[k,x[k]]));}
function audit(h=getHistory()){const ids=h.map(x=>x.id).filter(Boolean),si=sessions(h),seen=new Set(),dups=0;h.forEach(x=>{const k=key(x);if(seen.has(k))dups++;seen.add(k)});const issues=[];Object.entries(si).forEach(([k,v])=>{if(v[0].type!=='elliptical'&&v.filter(x=>x.exercise!=='Plank Finisher').length!==21)issues.push(k)});return{records:h.length,sessions:Object.keys(si).length,unique:new Set(ids).size,blank:h.length-ids.length,dupIds:ids.length-new Set(ids).size,dups,issues};}
function verifyDB(pop=false){const r=audit(),good=!r.blank&&!r.dupIds&&!r.dups&&!r.issues.length,msg=`Database ${good?'HEALTHY':'NEEDS REVIEW'}\n\nRecords: ${r.records}\nSessions: ${r.sessions}\nUnique IDs: ${r.unique}\nBlank IDs: ${r.blank}\nDuplicate IDs: ${r.dupIds}\nDuplicate records: ${r.dups}\nSession issues: ${r.issues.length}`;if(pop)alert(msg);document.getElementById('health').innerHTML=`<b>${good?'✓ Healthy':'⚠ Needs review'}</b><br>Cloud: ${cloudCount} | Local: ${r.records} | Sessions: ${r.sessions}<br>Unique IDs: ${r.unique} | Duplicate IDs: ${r.dupIds} | Duplicate records: ${r.dups}`;return r;}

slowly.","benefit":"Builds upper-back endurance for posture and swing control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-04-bent-over-crossover-lateral-raise.webp","library":"Resistance Platform"},{"id":"platform-05","name":"Bent Over Single Arm Lateral Raise","equipment":"Power Handles","body":"Back","movement":"Pull","golf":["Scapular Control","Balance"],"instructions":"Hinge with a neutral spine; keep the working arm slightly bent; raise it out to the side; resist torso rotation; lower under control; change sides.","benefit":"Improves unilateral shoulder and trunk stability.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-05-bent-over-single-arm-lateral-raise.webp","library":"Resistance Platform"},{"id":"platform-06","name":"Cross Over Rear Delt Row","equipment":"Power Handles","body":"Back","movement":"Row","golf":["Scapular Control","Posture"],"instructions":"Stand over crossed handles; hinge at hips; row elbows back and out while squeezing shoulder blades; keep neck neutral; return slowly.","benefit":"Strengthens rear shoulders and upper back for stable posture.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-06-cross-over-rear-delt-row.webp","library":"Resistance Platform"},{"id":"platform-07","name":"Alternating Bicep Curl","equipment":"Power Handles","body":"Arms","movement":"Curl","golf":["Muscular Endurance"],"instructions":"Stand tall with handles at sides; curl one hand without moving the upper arm; lower fully; alternate sides.","benefit":"Supports arm endurance and control without excessive body movement.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-07-alternating-bicep-curl.webp","library":"Resistance Platform"},{"id":"platform-08","name":"Bent Over Tricep Extension","equipment":"Power Handles","body":"Arms","movement":"Extension","golf":["Shoulder Stability"],"instructions":"Use connectors as shown; hinge forward; keep upper arm fixed; straighten the elbow; squeeze triceps; return slowly; repeat and change sides if required.","benefit":"Builds arm extension strength and shoulder control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-08-bent-over-tricep-extension.webp","library":"Resistance Platform"},{"id":"platform-09","name":"Single Arm Press","equipment":"Power Handles","body":"Shoulders","movement":"Press","golf":["Shoulder Stability","Core Stability"],"instructions":"Stand tall with one handle at shoulder height; brace to resist leaning; press overhead; finish without shrugging; lower slowly; change sides.","benefit":"Trains unilateral pressing and anti-lateral-flexion control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-09-single-arm-press.webp","library":"Resistance Platform"},{"id":"platform-10","name":"Arnold Press","equipment":"Power Handles","body":"Shoulders","movement":"Press","golf":["Shoulder Stability","Posture"],"instructions":"Start with handles at shoulder height and palms facing you; rotate palms forward as you press overhead; reverse smoothly on the way down.","benefit":"Develops shoulder strength through a large controlled range.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-10-arnold-press.webp","library":"Resistance Platform"},{"id":"platform-11","name":"Kneeling Press","equipment":"Resistance Bar","body":"Shoulders","movement":"Press","golf":["Core Stability","Posture"],"instructions":"Kneel securely on the platform; hold bar at upper chest; brace glutes and core; press overhead; keep ribs down; lower to start.","benefit":"Reduces lower-body assistance and challenges trunk control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-11-kneeling-press.webp","library":"Resistance Platform"},{"id":"platform-12","name":"Shoulder Press Behind","equipment":"Resistance Bar","body":"Shoulders","movement":"Press","golf":["Shoulder Stability","Posture"],"instructions":"Position the bar behind the shoulders only if comfortable; stand tall; press overhead without flaring ribs; lower with control. Use a pain-free range.","benefit":"Builds overhead strength; requires good shoulder mobility and control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-12-shoulder-press-behind.webp","library":"Resistance Platform"},{"id":"platform-13","name":"Shoulder Press Front","equipment":"Resistance Bar","body":"Shoulders","movement":"Press","golf":["Shoulder Stability","Posture"],"instructions":"Hold bar at front shoulder level; brace; press overhead in a straight path; keep ribs stacked; lower to shoulders.","benefit":"Builds shoulder strength and a stable upper-body frame.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-13-shoulder-press-front.webp","library":"Resistance Platform"},{"id":"platform-14","name":"Thruster","equipment":"Resistance Bar","body":"Full Body","movement":"Squat + Press","golf":["Ground Force","Power"],"instructions":"Hold bar at shoulders; squat with knees tracking over feet; drive up strongly and continue into an overhead press; lower bar before the next rep.","benefit":"Links lower-body ground force to upper-body power.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-14-thruster.webp","library":"Resistance Platform"},{"id":"platform-15","name":"Power Clean and Press","equipment":"Resistance Bar","body":"Full Body","movement":"Power","golf":["Ground Force","Power"],"instructions":"Start with bar low and spine neutral; drive through legs and hips; guide bar to shoulders; press overhead; reverse under control. Prioritise technique over load.","benefit":"Develops explosive force transfer through the whole body.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-15-power-clean-and-press.webp","library":"Resistance Platform"},{"id":"platform-16","name":"Front Raise","equipment":"Resistance Bar","body":"Shoulders","movement":"Raise","golf":["Shoulder Stability","Posture"],"instructions":"Stand tall with bar at thighs; keep elbows soft; raise bar forward to shoulder height without leaning; lower slowly.","benefit":"Develops anterior shoulder endurance and posture.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-16-front-raise.webp","library":"Resistance Platform"},{"id":"platform-17","name":"Upright Row","equipment":"Resistance Bar","body":"Shoulders","movement":"Pull","golf":["Scapular Control","Posture"],"instructions":"Stand tall with bar in front; pull upward close to the body with elbows leading; stop at a comfortable height; lower slowly.","benefit":"Strengthens shoulders and upper back; use a pain-free range.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-17-upright-row.webp","library":"Resistance Platform"},{"id":"platform-18","name":"Bent Over Row","equipment":"Resistance Bar","body":"Back","movement":"Row","golf":["Scapular Control","Posture"],"instructions":"Use connectors as shown; hinge at hips with neutral spine; pull bar toward lower ribs; squeeze shoulder blades; lower without rounding.","benefit":"Builds back strength and postural endurance for the address position.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-18-bent-over-row.webp","library":"Resistance Platform"},{"id":"platform-19","name":"Wide Grip Bicep Curl","equipment":"Resistance Bar","body":"Arms","movement":"Curl","golf":["Muscular Endurance"],"instructions":"Grip bar wider than shoulders; stand tall; curl without swinging or moving elbows forward; squeeze; lower fully.","benefit":"Builds arm strength with a wider grip emphasis.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-19-wide-grip-bicep-curl.webp","library":"Resistance Platform"},{"id":"platform-20","name":"Conventional Bicep Curl","equipment":"Resistance Bar","body":"Arms","movement":"Curl","golf":["Muscular Endurance"],"instructions":"Grip bar around shoulder width; keep elbows by sides; curl smoothly; avoid leaning back; lower to full extension.","benefit":"Builds general arm strength and control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-20-conventional-bicep-curl.webp","library":"Resistance Platform"},{"id":"platform-21","name":"Good Morning","equipment":"Resistance Bar","body":"Hamstrings","movement":"Hinge","golf":["Hip Strength","Posture"],"instructions":"Place bar across upper back; soften knees; push hips back while keeping spine neutral; stop when hamstrings load; drive hips forward to stand.","benefit":"Strengthens the posterior chain and golf posture.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-21-good-morning.webp","library":"Resistance Platform"},{"id":"platform-22","name":"Deadlift","equipment":"Resistance Bar","body":"Full Body","movement":"Hinge","golf":["Ground Force","Hip Strength"],"instructions":"Use connectors as shown; stand over bar; brace; hinge and bend knees to grip; drive through feet and extend hips; stand tall; lower by hinging first.","benefit":"Builds total-body strength and force production.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-22-deadlift.webp","library":"Resistance Platform"},{"id":"platform-23","name":"Romanian Deadlift","equipment":"Resistance Bar","body":"Hamstrings","movement":"Hinge","golf":["Hip Strength","Posture"],"instructions":"Use connectors as shown; start standing; soften knees; push hips back while bar tracks close to legs; feel hamstrings load; squeeze glutes to stand.","benefit":"Builds hamstrings, glutes and hip-hinge control.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-23-romanian-deadlift.webp","library":"Resistance Platform"},{"id":"platform-24","name":"Front Squat","equipment":"Resistance Bar","body":"Lower Body","movement":"Squat","golf":["Ground Force","Core Stability"],"instructions":"Hold bar at front shoulder level; brace and keep chest tall; sit between hips; keep knees tracking over feet; drive through full foot to stand.","benefit":"Develops lower-body strength, bracing and vertical ground force.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-24-front-squat.webp","library":"Resistance Platform"},{"id":"platform-25","name":"Back Squat","equipment":"Resistance Bar","body":"Lower Body","movement":"Squat","golf":["Ground Force","Power"],"instructions":"Place bar securely across upper back; brace; sit hips down and back; keep knees aligned with toes; drive through feet to stand.","benefit":"Builds leg strength and ground-force capacity.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-25-back-squat.webp","library":"Resistance Platform"},{"id":"platform-26","name":"Back Squat to Calf Lift","equipment":"Resistance Bar","body":"Lower Body","movement":"Squat + Calf Raise","golf":["Ground Force","Balance"],"instructions":"Perform a controlled back squat; stand fully; rise onto balls of feet for a calf lift; pause for balance; lower heels before the next rep.","benefit":"Combines leg strength, ankle force and balance.","sets":3,"reps":12,"source":"PTP Resistance Platform System Guide 2022","image":"images/platform/platform-26-back-squat-to-calf-lift.webp","library":"Resistance Platform"},{"id":"microband-01","name":"Swimming","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Shoulders","movement":"Shoulder mobility","golf":["Shoulder Stability","Posture"],"instructions":"Place the MicroBand around both wrists. Keep the ribs down and move the arms through a controlled swimming-style arc without letting the band slacken.","benefit":"Builds scapular control and shoulder endurance for a stable swing frame.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-01-swimming.webp"},{"id":"microband-02","name":"Dynamic Lunges","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Lunge","golf":["Ground Force","Hip Mobility"],"instructions":"Place the band above the knees. Step into a lunge, keep the lead knee tracking over the foot, then drive back to standing and alternate sides.","benefit":"Improves unilateral leg strength, balance and force transfer through the ground.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-02-dynamic-lunges.webp"},{"id":"microband-03","name":"Hip Flexor","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Hips","movement":"Hip flexion","golf":["Hip Mobility","Stability"],"instructions":"Loop the band around the feet. Stand tall and lift one knee against the band without leaning back; lower slowly and repeat on both sides.","benefit":"Strengthens active hip flexion for better lower-body control and walking endurance.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-03-hip-flexor.webp"},{"id":"microband-04","name":"Outward Push","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Shoulders","movement":"Press-out","golf":["Shoulder Stability","Posture"],"instructions":"Hold the band around the hands above chest level. Maintain outward tension while pressing the hands apart and returning under control.","benefit":"Reinforces shoulder positioning and upper-back engagement through the swing.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-04-outward-push.webp"},{"id":"microband-05","name":"Squat","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Squat","golf":["Ground Force","Stability"],"instructions":"Place the band above the knees. Sit the hips back and down while pressing the knees gently outward; stand by driving through the whole foot.","benefit":"Develops leg strength and knee tracking for consistent ground-force production.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-05-squat.webp"},{"id":"microband-06","name":"Plank","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Core","movement":"Anti-extension","golf":["Core Stability","Posture"],"instructions":"Place the band around the wrists and hold a firm plank. Maintain outward pressure while keeping the body in a straight line.","benefit":"Builds anti-extension core endurance and shoulder stability to maintain posture.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-06-plank.webp"},{"id":"microband-07","name":"Abduction - Legs in the Air","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Hips","movement":"Hip abduction","golf":["Pelvic Stability","Hip Mobility"],"instructions":"Lie on the back with legs raised and the band around the feet or lower legs. Separate the legs against resistance, then return slowly.","benefit":"Strengthens the hip abductors for pelvic control during rotation and weight shift.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-07-abduction-legs-in-the-air.webp"},{"id":"microband-08","name":"Robot Walk","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Lateral walk","golf":["Pelvic Stability","Ground Force"],"instructions":"Place the band around the feet or ankles. Keep a slight squat and take controlled lateral steps without letting the knees collapse inward.","benefit":"Builds glute medius endurance for stable lateral movement and balance.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-08-robot-walk.webp"},{"id":"microband-09","name":"Sumo Walk","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Lateral walk","golf":["Pelvic Stability","Ground Force"],"instructions":"Place the band above the knees. Use a wide athletic stance and step side to side while maintaining outward knee pressure.","benefit":"Strengthens glutes and lateral hip stabilisers for a solid swing base.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-09-sumo-walk.webp"},{"id":"microband-10","name":"Kick Through","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Full Body","movement":"Rotation","golf":["Rotation","Core Stability"],"instructions":"With the band around the feet, move from a supported crouch and extend one leg diagonally through, then return and alternate sides.","benefit":"Combines trunk control, hip mobility and rotational coordination.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-10-kick-through.webp"},{"id":"microband-11","name":"Side Skating","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Lateral locomotion","golf":["Ground Force","Balance"],"instructions":"Place the band above the knees or at the ankles. Push laterally from one leg to the other and control each landing.","benefit":"Trains lateral force, single-leg control and athletic balance.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-11-side-skating.webp"},{"id":"microband-12","name":"Lying Leg Curl","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Hamstrings","movement":"Knee flexion","golf":["Posterior Chain","Stability"],"instructions":"Lie face down with the band around the ankles. Curl one heel toward the glutes while keeping the hips down; alternate sides.","benefit":"Builds hamstring strength to support hip hinge mechanics and knee stability.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-12-lying-leg-curl.webp"},{"id":"microband-13","name":"Squat / Hip Rotation","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Squat rotation","golf":["Rotation","Ground Force"],"instructions":"Place the band above the knees. Perform a squat, then rotate through the hip as you rise while keeping control through the feet.","benefit":"Links lower-body force with controlled pelvic rotation.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-13-squat-hip-rotation.webp"},{"id":"microband-14","name":"Straddle Leg Raise","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Core","movement":"Leg raise","golf":["Core Stability","Pelvic Stability"],"instructions":"Lie on the back with the band around the feet. Raise the legs, open them against resistance, and lower only as far as the trunk remains stable.","benefit":"Challenges lower-abdominal control and hip stability for consistent spine angle.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-14-straddle-leg-raise.webp"},{"id":"microband-15","name":"Squat Pulse","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Body","movement":"Squat pulse","golf":["Ground Force","Leg Endurance"],"instructions":"Place the band above the knees. Hold a squat and perform small controlled pulses while maintaining outward knee pressure.","benefit":"Develops lower-body endurance for maintaining posture late in a round.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-15-squat-pulse.webp"},{"id":"microband-16","name":"Straight Leg Lifts","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Hips","movement":"Hip extension","golf":["Posterior Chain","Pelvic Stability"],"instructions":"Place the band around the ankles. Keep the working leg straight and lift it without arching the lower back; lower slowly.","benefit":"Strengthens glutes and posterior-chain control for trail-leg drive.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-16-straight-leg-lifts.webp"},{"id":"microband-17","name":"Bear Crawl","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Full Body","movement":"Crawl","golf":["Core Stability","Shoulder Stability"],"instructions":"Place the band around the wrists. From a bear position, keep knees low and crawl with small opposite hand-and-foot steps.","benefit":"Integrates shoulder stability, trunk control and cross-body coordination.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-17-bear-crawl.webp"},{"id":"microband-18","name":"Opposite Hand-to-Toe","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Core","movement":"Cross-body reach","golf":["Rotation","Balance"],"instructions":"Lie on the back with the band around the feet. Reach one hand toward the opposite foot while keeping the movement controlled, then alternate.","benefit":"Trains diagonal core control and coordination relevant to rotational sequencing.","sets":3,"reps":"5-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-18-opposite-hand-to-toe.webp"},{"id":"microband-19","name":"Abdominal Curl - Feet Down","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Core","movement":"Trunk flexion","golf":["Core Stability","Posture"],"instructions":"Lie on the back with feet planted and the band around the thighs. Maintain outward knee tension and curl the ribcage toward the pelvis.","benefit":"Builds anterior-core endurance while keeping the pelvis controlled.","sets":3,"reps":"8-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-19-abdominal-curl-feet-down.webp"},{"id":"microband-20","name":"Ankle Stability","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Lower Leg","movement":"Ankle control","golf":["Balance","Ground Force"],"instructions":"Sit with the band around the feet. Move one foot against the band while keeping the knee and lower leg controlled; perform both sides.","benefit":"Improves ankle control and foot stability for a more reliable base.","sets":3,"reps":"8-10","source":"PTP Micro Bands Workout Listing and Guide","image":"images/microband/microband-20-ankle-stability.webp"},{"id":"microband-21","name":"Baby Clam","library":"MicroBand","equipment":"PTP MicroBand X+","resistance":"Light / Medium / Heavy","body":"Hips","movement function switchParentTab(tab) {

  document.querySelectorAll('.parent-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`parent-${tab.toLowerCase()}`).classList.add('active');

  if(tab==='Library') renderLibrary();
  if(tab==='Programs' && window.renderPrograms) window.renderPrograms();
  if(tab==='History') renderHistory();
  if(tab==='Analytics') renderAnalytics();
}

function switchSubTab(subTab) {

  document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
  const cleanId = subTab.toLowerCase().replace(' ', '').replace('-', '');
  const targetBtn = document.getElementById(`sub-${cleanId}`);

}

function getHistory() {
  const history = JSON.parse(localStorage.getItem('ptp_workout_history') || '[]');
  return history.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

function getMaxWeightPR(exName) {
  const history = getHistory();
  const entries = history.filter(h => h.exercise === exName);
  if (!entries.length) return 0;
  return Math.max(...entries.map(e => parseFloat(e.weight || 0)));
}

function previousExerciseSession(exName, beforeDate) {
  const rows=getHistory().filter(h=>h.exercise===exName && h.type==='resistance' && (!beforeDate || h.date<beforeDate));
  if(!rows.length) return [];
  const latest=rows.map(x=>x.date).sort().at(-1);
  return rows.filter(x=>x.date===latest).sort((a,b)=>Number(a.setNum)-Number(b.setNum));
}
function applySmartDefaults(exName, exIdx, isPlank) {
  const date=document.getElementById('session-date').value;
  const prev=previousExerciseSession(exName,date);
  if(!prev.length) return;
  const last=prev.find(x=>Number(x.setNum)===3)||prev.at(-1);
  for(let n=1;n<=3;n++){
    const old=prev.find(x=>Number(x.setNum)===n)||last;
    const reps=document.getElementById(`reps-${exIdx}-${n}`); if(reps&&old?.reps) reps.value=old.reps;
    if(!isPlank){ ['b1','b2','b3','b4'].forEach(k=>{const el=document.getElementById(`${k}-${exIdx}-${n}`);if(el)el.value=canonicalBand(last?.[k]);}); recalcRow(exIdx,n); }
  }
}

 const last=prev.find(x=>Number(x.setNum)===3)||prev.at(-1); const bands=['b1','b2','b3','b4'].map(k=>canonicalBand(last[k])).filter(x=>x!=='None').map(bandLabel).join(' + ')||'Bodyweight';
 return `Smart start: last set from ${last.date} applied to all 3 sets (${bands}); previous reps retained.`;
}

function renderBandOptions(selected='None') {
  return BAND_OPTIONS.map(b => `<option value="${b}" ${canonicalBand(selected)===b?'selected':''}>${bandLabel(b)}</option>`).join('');
}

function recalcRow(exIdx, setNum) {
  const b1 = document.getElementById(`b1-${exIdx}-${setNum}`).value;
  const b2 = document.getElementById(`b2-${exIdx}-${setNum}`).value;
  const b3 = document.getElementById(`b3-${exIdx}-${setNum}`).value;
  const b4 = document.getElementById(`b4-${exIdx}-${setNum}`).value;
  const mult = EXERCISES[currentSubTab][exIdx].mult;

  const totalWt = (BANDS[b1] + BANDS[b2] + BANDS[b3] + BANDS[b4]) * mult;
  document.getElementById(`wt-${exIdx}-${setNum}`).innerText = totalWt.toFixed(1) + ' kg';
}

function togglePlankTimer(exIdx, setNum) {
  const key = `${exIdx}-${setNum}`;
  const btn = document.getElementById(`plank-timer-btn-${key}`);
  const input = document.getElementById(`reps-${key}`);

  if (activePlankKey === key && plankTimer) {
    clearInterval(plankTimer);
    plankTimer = null;
    activePlankKey = null;
    btn.classList.remove('active-timer');
    btn.innerText = 'Start Plank Timer';
    input.value = plankSeconds;
    logSet('Plank Finisher', exIdx, setNum, 0.0, true);
  } else {
    if (plankTimer) clearInterval(plankTimer);
    plankSeconds = 0;
    activePlankKey = key;
    btn.classList.add('active-timer');
    btn.innerText = `Stop & Record (${plankSeconds}s)`;
    plankTimer = setInterval(() => {
      plankSeconds++;
      btn.innerText = `Stop & Record (${plankSeconds}s)`;
    }, 1000);
  }
}

function createFirestoreId() {
  if (!window.doc || !window.dbCollection) throw new Error('Firestore is not ready. Please wait a moment and try again.');
  return window.doc(window.dbCollection).id;
}
function saveLogToCloud(logEntry) {
  if (!logEntry.id) logEntry.id = createFirestoreId();
  if (!logEntry.timestamp) logEntry.timestamp = Date.now();
  const cloudEntry = { ...logEntry }; delete cloudEntry.id;
  const docRef = window.doc(window.db, "workout_history", logEntry.id);
  return window.setDoc(docRef, cloudEntry).catch(e => console.warn('Cloud sync queued offline:', e));
}
function deleteLogFromCloud(docId) {
  if (!docId) return;
  if (window.deleteDoc && window.doc && window.db) {
    const docRef = window.doc(window.db, "workout_history", docId);
    window.deleteDoc(docRef).catch(e => console.warn("Cloud delete restricted:", e));
  }
}

function deleteHistoryItem(docId, timestamp) {
  if (!confirm("Delete this set from history?")) return;

  let history = getHistory();
  if (docId) {
    history = history.filter(h => h.id !== docId);
    deleteLogFromCloud(docId);
  } else {
    history = history.filter(h => h.timestamp !== timestamp);
  }

  localStorage.setItem('ptp_workout_history', JSON.stringify(history));
  renderHistory();
  renderAnalytics();
}

function logSet(exName, exIdx, setNum, mult, isPlank) {
  const date = document.getElementById('session-date').value;
  const readiness = document.getElementById('session-readiness').value;
  const kcal = document.getElementById('apple-kcal').value || '';
  const hr = document.getElementById('apple-hr').value || '';
  const reps = document.getElementById(`reps-${exIdx}-${setNum}`).value;

  let b1 = "None", b2 = "None", b3 = "None", b4 = "None", weight = 0;
  if (!isPlank) {
    b1 = document.getElementById(`b1-${exIdx}-${setNum}`).value;
    b2 = document.getElementById(`b2-${exIdx}-${setNum}`).value;
    b3 = document.getElementById(`b3-${exIdx}-${setNum}`).value;
    b4 = document.getElementById(`b4-${exIdx}-${setNum}`).value;
    weight = ((BANDS[b1] + BANDS[b2] + BANDS[b3] + BANDS[b4]) * mult).toFixed(1);
  }

  const currentMax = getMaxWeightPR(exName);
  const isPR = parseFloat(weight) > currentMax && !isPlank;
  const logEntry = { id: createFirestoreId(), timestamp: Date.now(), type: 'resistance', date, day: currentSubTab, readiness, exercise: exName, setNum, b1, b2, b3, b4, reps, weight, kcal, hr };

  const history = getHistory();
  history.push(logEntry);
  localStorage.setItem('ptp_workout_history', JSON.stringify(history));
  saveLogToCloud(logEntry);

  const btn = document.getElementById(`btn-${exIdx}-${setNum}`);
  btn.classList.add('logged');
  btn.innerText = isPR ? '🏆 PR!' : '✓';
  startRestTimer(30);
}

function logElliptical() {
  const date = document.getElementById('cardio-date').value;
  const duration = document.getElementById('cardio-time').value || 0;
  const distance = document.getElementById('cardio-dist').value || 0;
  const kcal = document.getElementById('cardio-kcal').value || 0;
  const hr = document.getElementById('cardio-hr').value || 0;
  const level = document.getElementById('cardio-level').value || 1;
  const program = document.getElementById('cardio-prog').value;

  if (!duration) return alert("Please enter workout duration!");

  const logEntry = { id: createFirestoreId(), timestamp: Date.now(), type: 'elliptical', date, day: 'Elliptical', exercise: 'Elliptical Trainer', duration, distance, kcal, hr, level, program };
  const history = getHistory();
  history.push(logEntry);
  localStorage.setItem('ptp_workout_history', JSON.stringify(history));
  saveLogToCloud(logEntry);

  alert('Elliptical session logged successfully!');
}

function calendar(si){const ds=Object.keys(si).map(k=>k.split(' - ')[0]).sort();if(ds.length&&!calCursor.fixed){calCursor=new Date(ds.at(-1)+'T12:00:00');calCursor.fixed=true}const y=calCursor.getFullYear(),m=calCursor.getMonth(),f=new Date(y,m,1),last=new Date(y,m+1,0),off=(f.getDay()+6)%7;let z=`<div class="calhead"><button onclick="calCursor=new Date(${y},${m-1},1);calCursor.fixed=true;renderHistory()">‹</button><b>${f.toLocaleString(undefined,{month:'long',year:'numeric'})}</b><button onclick="calCursor=new Date(${y},${m+1},1);calCursor.fixed=true;renderHistory()">›</button></div><div class="chart-legend">🟢 Day 1 &nbsp; 🟠 Day 2 &nbsp; 🔴 Day 3 &nbsp; 🔵 Elliptical</div><div class="calendar">`;['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(x=>z+=`<div>${x}</div>`);for(let i=0;i<off;i++)z+='<div class="calday blank"></div>';for(let d=1;d<=last.getDate();d++){const q=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,k=Object.keys(si).find(x=>x.startsWith(q+' - '));z+=k?`<div class="calday hit ${dayClass(si[k][0].day)}" onclick="openCalendarSession('${k}')">${d}<span class="tag">${si[k][0].day==='Elliptical'?'EL':si[k][0].day.replace('Day ','D')}</span></div>`:`<div class="calday">${d}</div>`}return z+='</div>';}

function readinessBreakdown(ss){
 if(!ss.length)return {total:0,consistency:0,compliance:0,strength:0,conditioning:0,recovery:0,best:'—',opportunity:'—',explanation:'No sessions yet'};
 const sorted=[...ss].sort((a,b)=>a[0].date.localeCompare(b[0].date)), end=new Date(sorted.at(-1)[0].date+'T12:00:00');
 const recent=sorted.filter(r=>(end-new Date(r[0].date+'T12:00:00'))/86400000<=30);
 const consistency=Math.round(Math.min(100,new Set(recent.map(r=>r[0].date)).size/12*100));
 const counts=['Day 1','Day 2','Day 3'].map(d=>recent.filter(r=>r[0].day===d).length), target=Math.max(1,Math.max(...counts));
 const balance=Math.min(...counts)/target*100, complete=recent.filter(r=>r.filter(x=>x.exercise!=='Plank Finisher').length===21).length/Math.max(1,recent.length)*100;
 const compliance=Math.round(balance*.55+complete*.45);
 const all=getHistory().filter(x=>x.type==='resistance'&&x.exercise!=='Plank Finisher'), exs=[...new Set(all.map(x=>x.exercise))];
 const changes=exs.map(ex=>{const r=all.filter(x=>x.exercise===ex).sort((a,b)=>a.date.localeCompare(b.date)), ds=[...new Set(r.map(x=>x.date))];if(ds.length<2)return 0;const first=Math.max(...r.filter(x=>x.date===ds[0]).map(x=>Number(x.weight||0))), last=Math.max(...r.filter(x=>x.date===ds.at(-1)).map(x=>Number(x.weight||0)));return first?Math.max(-1,Math.min(1,(last-first)/first)):0});
 const avgChange=changes.length?changes.reduce((a,b)=>a+b,0)/changes.length:0, strength=Math.round(Math.max(0,Math.min(100,60+avgChange*100)));
 const hrs=recent.map(r=>Number(r[0].hr||0)).filter(Boolean), kcals=recent.map(r=>Number(r[0].kcal||0)).filter(Boolean), elliptical=getHistory().filter(x=>x.type==='elliptical'&&(end-new Date(x.date+'T12:00:00'))/86400000<=30).length;
 const dataCoverage=(hrs.length+kcals.length)/(Math.max(1,recent.length)*2); const conditioning=Math.round(Math.min(100,45+dataCoverage*35+Math.min(20,elliptical*10)));
 const readinessVals=recent.map(r=>Number(r[0].readiness||0)).filter(Boolean), recovery=Math.round((readinessVals.reduce((a,b)=>a+b,0)/Math.max(1,readinessVals.length))/5*100);
 const parts={Consistency:consistency,Compliance:compliance,Strength:strength,Conditioning:conditioning,Recovery:recovery};
 const total=Math.round(consistency*.30+compliance*.20+strength*.20+conditioning*.15+recovery*.15), best=Object.entries(parts).sort((a,b)=>b[1]-a[1])[0][0], opportunity=Object.entries(parts).sort((a,b)=>a[1]-b[1])[0][0];
 return {total,consistency,compliance,strength,conditioning,recovery,best,opportunity,explanation:'Consistency 30% · Compliance 20% · Strength 20% · Conditioning 15% · Recovery 15%'};
}

function currentStreak(ss){if(!ss.length)return 0;const dates=[...new Set(ss.map(r=>r[0].date))].sort().reverse();let n=1;for(let i=1;i<dates.length;i++){const gap=(new Date(dates[i-1]+'T12:00:00')-new Date(dates[i]+'T12:00:00'))/86400000;if(gap<=8)n++;else break;}return n;}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function startRestTimer(seconds) {
  clearInterval(restTimer);
  timerSeconds = seconds;
  document.getElementById('timer-banner').style.display = 'flex';
  updateTimerDisplay();
  restTimer = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      playBeep();
      stopTimer();
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById('timer-display').innerText = `Rest Timer: ${timerSeconds}s`;
}

function addTimerTime(secs) {
  timerSeconds += secs;
  updateTimerDisplay();
}

function stopTimer() {
  clearInterval(restTimer);
  document.getElementById('timer-banner').style.display = 'none';
}

function exportCSV() {
  const history = getHistory();
  if (history.length === 0) return alert("No history logged yet!");
  let csv = "Type,Date,Workout Day,Readiness,Exercise Name,Set #,Band 1,Band 2,Band 3,Band 4,Reps/Secs/Duration,Calculated Wt (kg)/Dist (km),Active kcal,Avg HR,Program/Level\n";
  history.forEach(h => {
    if (h.type === 'elliptical') {
      csv += `Elliptical,${h.date},${h.day},N/A,"${h.exercise}",1,N/A,N/A,N/A,N/A,${h.duration},${h.distance},${h.kcal},${h.hr},"${h.program} (Lvl ${h.level})"\n`;
    } else {
      csv += `Resistance,${h.date},${h.day},${h.readiness},"${h.exercise}",${h.setNum},${h.b1},${h.b2},${h.b3},${h.b4},${h.reps},${h.weight},${h.kcal},${h.hr},N/A\n`;
    }
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', `Golf_Performance_System_History_${new Date().toISOString().split('T')[0]}.csv`);
  a.click();
}

function exportJSON(gold=false){const h=getHistory(),r=audit(h);if(!h.length)return alert('No history.');if(!confirm(`${gold?'GOLD MASTER':'BACKUP'}\n\nRecords: ${r.records}\nSessions: ${r.sessions}\nUnique IDs: ${r.unique}\nDuplicate IDs: ${r.dupIds}\nDuplicate records: ${r.dups}\n\nCreate file?`))return;const b=new Blob([JSON.stringify(h,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a'),d=new Date().toISOString().split('T')[0];a.href=u;a.download=gold?`Golf_Performance_System_Gold_Master_${d}.json`:`Golf_Performance_System_Backup_${d}.json`;a.click();URL.revokeObjectURL(u);localStorage.setItem('ptp_last_backup',new Date().toISOString());backupReminder();}

async function replaceFirestoreHistory(importedData) {
  const seenIds = new Set();
  const prepared = importedData.map((raw,index) => { if(!raw||typeof raw!=='object'||Array.isArray(raw)) throw new Error(`Record ${index+1} is invalid.`); const item={...raw}; if(!item.id)item.id=createFirestoreId(); if(seenIds.has(item.id))throw new Error(`Duplicate ID: ${item.id}`); seenIds.add(item.id); if(!item.timestamp)item.timestamp=Date.now(); return item; });
  const existing=await window.getDocs(window.dbCollection), operations=[];
  existing.forEach(s=>operations.push({type:'delete',ref:s.ref}));
  prepared.forEach(item=>{const cloudEntry={...item};delete cloudEntry.id;operations.push({type:'set',ref:window.doc(window.db,'workout_history',item.id),data:cloudEntry});});
  for(let i=0;i<operations.length;i+=450){const batch=window.writeBatch(window.db);operations.slice(i,i+450).forEach(op=>op.type==='delete'?batch.delete(op.ref):batch.set(op.ref,op.data));await batch.commit();}
  localStorage.setItem('ptp_workout_history',JSON.stringify(prepared)); return prepared.length;
}
function importJSON(event) {
  const file=event.target.files[0]; if(!file)return;
  if(!confirm('REPLACE CLOUD HISTORY?\n\nThis permanently replaces all cloud workout history. Continue only with a verified backup.')){event.target.value='';return;}
  const reader=new FileReader(); reader.onload=async function(e){try{const importedData=JSON.parse(e.target.result);if(!Array.isArray(importedData))throw new Error('Expected an array of workouts.');if(!importedData.length)throw new Error('Backup is empty.');const r=audit(importedData);if(r.blank||r.dupIds||r.dups)throw new Error(`Validation failed. Blank IDs: ${r.blank}; duplicate IDs: ${r.dupIds}; duplicate records: ${r.dups}`);if(!confirm(`RESTORE PREVIEW\n\nFile: ${file.name}\nRecords: ${r.records}\nSessions: ${r.sessions}\nUnique IDs: ${r.unique}\n\nProceed with full replacement?`))return;setStatus('busy');const count=await replaceFirestoreHistory(importedData);alert(`Restore complete. Firestore now contains ${count} workout records.`);renderHistory();renderAnalytics();renderSubView();}catch(err){alert('Restore failed: '+err.message);}finally{event.target.value='';}};reader.readAsText(file);
}
